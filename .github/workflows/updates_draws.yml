name: Update Draws
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests beautifulsoup4
      - name: Fetch
        run: |
          python -c "
          import requests, json, re
          from bs4 import BeautifulSoup
          from datetime import datetime
          headers={'User-Agent':'Mozilla/5.0'}
          all_draws={}
          urls=['https://footystats.org/england/efl-league-two','https://footystats.org/england/efl-league-one']
          for url in urls:
              try:
                  r=requests.get(url, headers=headers, timeout=20)
                  print(f'{url} {r.status_code} len {len(r.text)}')
                  if r.status_code==200:
                      soup=BeautifulSoup(r.text,'html.parser')
                      text=soup.get_text()
                      matches=re.findall(r'([A-Za-z ]{3,20})\s+(\d{1,2})%', text)
                      for team,pct in matches:
                          team=team.strip()
                          try:
                              p=int(pct)
                              if 5<=p<=70 and len(team)>=3:
                                  if team not in ['Draws','Team','Club']:
                                      all_draws[team]=p
                          except: pass
              except Exception as e:
                  print(e)
          print(f'Found {len(all_draws)} teams')
          output={'updated':datetime.utcnow().isoformat()+'Z','source':'FootyStats US runner','teams':all_draws}
          with open('draws_live.json','w') as f:
              json.dump(output,f,indent=2)
          "
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add draws_live.json
          git diff --cached --quiet || git commit -m "Update draws"
          git push
